name: Check local video library

on:
  push:
    branches:
      - feature/recording-3-2
    paths:
      - 'src/**'
      - 'public/**'
      - 'bun.lock'
      - 'package.json'
      - 'tests/localPracticeHistory.test.js'
      - 'tests/presentationRecordingService.test.js'
      - 'tests/recordingNames.test.js'
      - 'tests/meetingGridCapture.test.js'
      - 'tests/meetingScreenSwitch.test.js'
      - 'tests/meetingNoAutoSlides.test.js'
      - '.github/workflows/check-local-video-library.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-local-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test local account history
        run: bun test tests/localPracticeHistory.test.js
      - name: Test webcam and screen recording modes
        run: bun test tests/presentationRecordingService.test.js
      - name: Test recording names
        run: bun test tests/recordingNames.test.js
      - name: Test meeting tile geometry
        run: bun test tests/meetingGridCapture.test.js
      - name: Test screen sharing transitions during active recording
        run: bun test tests/meetingScreenSwitch.test.js
      - name: Test no auto-injected presentation
        run: bun test tests/meetingNoAutoSlides.test.js
      - name: TypeScript check
        run: bun run lint
      - name: Build Preview frontend
        run: bun run build
