name: Check local video library

on:
  # Every proposed merge into main must run these checks, even for docs-only changes.
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/recording-3-2
      - main
    paths:
      - 'src/**'
      - 'api/ai/**'
      - 'server/freeSpeechReview.js'
      - 'tests/freeSpeechReview.test.js'
      - 'tests/aiReviewRoute.test.js'
      - 'tests/pptxReviewText.test.js'
      - 'tests/localAiReviewLibrary.test.js'
      - 'tests/aiReviewResults.test.js'
      - 'tests/aiReviewAcceptance.test.js'
      - 'tests/googleIdentityRelease.test.js'
      - 'tests/productionReleaseGuards.test.js'
      - 'server/googleIdentity.js'
      - 'server/sessionCookie.js'
      - 'server/driveOAuthBootstrap.js'
      - 'api/auth/**'
      - 'api/google-drive/**'
      - 'public/**'
      - 'bun.lock'
      - 'package.json'
      - 'tests/localPracticeHistory.test.js'
      - 'tests/practiceBrief.test.js'
      - 'tests/vietnameseSpeechRecognition.test.js'
      - 'tests/localTranscriptLibrary.test.js'
      - 'tests/presentationRecordingService.test.js'
      - 'tests/recordingNames.test.js'
      - 'tests/meetingGridCapture.test.js'
      - 'tests/meetingScreenSwitch.test.js'
      - 'tests/meetingNoAutoSlides.test.js'
      - '.github/workflows/check-local-video-library.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-local-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test Phase 7.2 browser speech recognition
        run: bun test tests/vietnameseSpeechRecognition.test.js
      - name: Test Phase 7.2.1 separate transcript library
        run: bun test tests/localTranscriptLibrary.test.js
      - name: Test Phase 7.1 learner topic setup
        run: bun test tests/practiceBrief.test.js
      - name: Test local account history
        run: bun test tests/localPracticeHistory.test.js
      - name: Test webcam and screen recording modes
        run: bun test tests/presentationRecordingService.test.js
      - name: Test recording names
        run: bun test tests/recordingNames.test.js
      - name: Test meeting tile geometry
        run: bun test tests/meetingGridCapture.test.js
      - name: Test screen sharing transitions during active recording
        run: bun test tests/meetingScreenSwitch.test.js
      - name: Test no auto-injected presentation
        run: bun test tests/meetingNoAutoSlides.test.js
      - name: Test Phase 7.3.1 review security, evidence and quotas
        run: node --test tests/freeSpeechReview.test.js
      - name: Test Phase 7.3.1 authentication and disabled API behavior
        run: node --test tests/aiReviewRoute.test.js
      - name: Test Phase 7.3.1 optional PowerPoint evidence
        run: bun test tests/pptxReviewText.test.js
      - name: Test Phase 7.3.2 local AI review history
        run: bun test tests/localAiReviewLibrary.test.js
      - name: Test Phase 7.3.3.3 AI review result layout
        run: bun test tests/aiReviewResults.test.js
      - name: Test Phase 7.3.3.4 integrated AI review acceptance
        run: bun test tests/aiReviewAcceptance.test.js
      - name: Test release authentication and Production fail-closed guards
        run: node --test tests/googleIdentityRelease.test.js tests/productionReleaseGuards.test.js
      - name: TypeScript check
        run: bun run lint
      - name: Build Preview frontend
        run: bun run build
