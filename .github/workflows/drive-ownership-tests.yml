name: Drive owner authorization tests

on:
  push:
    branches:
      - feature/recording-3-2
    paths:
      - 'server/driveVideoAuthorization.js'
      - 'server/driveVideoReader.js'
      - 'api/google-drive/videos.js'
      - 'tests/driveVideoAuthorization.test.js'
      - 'tests/driveVideoReader.test.js'
      - 'package.json'
      - '.github/workflows/drive-ownership-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline authorization tests (no Drive credentials)
        run: npm run test:drive
